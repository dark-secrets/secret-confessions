<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>sara 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>

<style>
/* ─── design tokens ─────────────────────────────── */
:root{
  --p0:#fff0f3;--p1:#ffd6e0;--p2:#ffafc5;--p3:#f48fb1;
  --cream:#fffaf8;--glass:rgba(255,248,250,0.52);
  --ink:#6b3a4a;--dust:#b07a8a;--faint:#ddb0bb;
  --s1:rgba(255,175,197,.18);--s2:rgba(255,214,224,.28);
  --rad:2.6rem;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* ─── cursor ─────────────────────────────────────── */
body{cursor:none;}
#cur{
  position:fixed;width:14px;height:14px;border-radius:50%;
  background:var(--p2);pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
  transition:width .2s,height .2s,background .2s,opacity .15s;
  mix-blend-mode:multiply;
}
#cur-ring{
  position:fixed;width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--p3);pointer-events:none;z-index:9998;
  transform:translate(-50%,-50%);
  transition:transform .1s ease,width .25s,height .25s,opacity .2s;
  opacity:.55;
}

/* ─── scrollbar ──────────────────────────────────── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--p0);}
::-webkit-scrollbar-thumb{background:var(--p2);border-radius:4px;}

/* ─── body & atmosphere ──────────────────────────── */
html,body{min-height:100%;width:100%;overflow-x:hidden;}
body{
  font-family:'Jost',sans-serif;
  background-color:#fde8ee;
  background-image:
    radial-gradient(ellipse 90% 70% at  15%   5%, #fce4ec 0%, transparent 55%),
    radial-gradient(ellipse 60% 55% at  88%  18%, #ffdde7 0%, transparent 50%),
    radial-gradient(ellipse 50% 45% at  50%  55%, #fff0f3 0%, transparent 60%),
    radial-gradient(ellipse 70% 65% at   8%  85%, #fce4ec 0%, transparent 55%),
    radial-gradient(ellipse 55% 50% at  92%  80%, #ffd6e0 0%, transparent 50%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2rem 1rem 90px;
  min-height:100vh;
}

/* ─── noise overlay ──────────────────────────────── */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  background-size:180px;opacity:.4;
}

/* ─── floating sparkle particles (JS-generated) ──── */
.spark{
  position:fixed;pointer-events:none;font-size:.75rem;
  opacity:0;animation:sparkFloat linear infinite;
}
@keyframes sparkFloat{
  0%  {transform:translateY(0)   rotate(0deg)  scale(0);opacity:0}
  10% {opacity:.7;scale:1}
  85% {opacity:.5}
  100%{transform:translateY(-110vh) rotate(540deg) scale(.4);opacity:0}
}

/* ─── main card wrapper (float) ──────────────────── */
.wrap{
  position:relative;z-index:1;
  animation:floatY 7s ease-in-out infinite;
}
@keyframes floatY{
  0%,100%{transform:translateY(0)}
  50%    {transform:translateY(-12px)}
}

/* ─── glass card ─────────────────────────────────── */
.card{
  position:relative;
  width:min(420px,93vw);
  padding:3.2rem 2.6rem 2.8rem;
  border-radius:var(--rad);
  background:var(--glass);
  backdrop-filter:blur(32px) saturate(1.6) brightness(1.04);
  -webkit-backdrop-filter:blur(32px) saturate(1.6) brightness(1.04);
  border:1.5px solid rgba(255,200,215,.5);
  box-shadow:
    0 2px  0   rgba(255,255,255,.85) inset,
    0 -1px 0   rgba(255,190,210,.2)  inset,
    0 12px 60px rgba(230,130,155,.18),
    0  4px 20px rgba(230,130,155,.10);
  text-align:center;
  animation:cardIn .95s var(--ease-out) both;
  overflow:hidden;
}
@keyframes cardIn{
  from{opacity:0;filter:blur(14px);transform:scale(.93) translateY(20px)}
  to  {opacity:1;filter:blur(0);   transform:scale(1)   translateY(0)}
}

/* gloss streak */
.card::before{
  content:'';position:absolute;
  top:-30%;left:-20%;width:55%;height:80%;
  background:linear-gradient(135deg,rgba(255,255,255,.45) 0%,transparent 60%);
  border-radius:50%;pointer-events:none;
  transform:rotate(-20deg);
}

/* ─── decorative corner blobs ────────────────────── */
.blob{
  position:absolute;border-radius:50%;pointer-events:none;
  filter:blur(28px);opacity:.55;
}
.blob-tl{width:120px;height:120px;top:-30px;left:-30px;
  background:radial-gradient(circle,#ffb3c8 0%,transparent 70%);}
.blob-br{width:140px;height:140px;bottom:-35px;right:-35px;
  background:radial-gradient(circle,#ffccd8 0%,transparent 70%);}

/* ─── avatar ─────────────────────────────────────── */
.av-shell{
  position:relative;width:104px;height:104px;
  margin:0 auto 1.6rem;
}
.av-ring{
  width:100%;height:100%;border-radius:50%;
  padding:3px;
  background:conic-gradient(from 0deg,
    #ffafc5,#ffd6e0,#ff85a1,#ffdde7,#ffafc5);
  animation:ringHue 4s linear infinite;
  box-shadow:0 0 24px rgba(255,133,161,.4),0 0 8px rgba(255,133,161,.2);
}
@keyframes ringHue{
  to{filter:hue-rotate(18deg) brightness(1.06)}
}
.av-face{
  width:100%;height:100%;border-radius:50%;
  background:linear-gradient(135deg,#fce4ec 0%,#ffd6e0 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:2.8rem;border:3px solid #fff;
  overflow:hidden;
}
/* small badge */
.av-badge{
  position:absolute;bottom:3px;right:3px;
  width:24px;height:24px;border-radius:50%;
  background:#fff;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;
  box-shadow:0 2px 8px rgba(200,100,130,.25);
  animation:badgePop .5s 1s var(--ease-spring) both;
}
@keyframes badgePop{
  from{transform:scale(0);opacity:0}
  to  {transform:scale(1);opacity:1}
}

/* ─── name ───────────────────────────────────────── */
.name{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-weight:400;
  font-size:3rem;
  letter-spacing:.04em;
  color:var(--ink);
  line-height:1;
  margin-bottom:.3rem;
  animation:fadeUp .7s .15s var(--ease-out) both;
}

/* ─── handle pill ────────────────────────────────── */
.handle{
  display:inline-flex;align-items:center;gap:.35rem;
  background:rgba(255,210,220,.45);
  border:1px solid rgba(255,175,197,.4);
  border-radius:999px;
  padding:.22rem .85rem;
  font-size:.7rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--dust);
  font-weight:300;
  margin-bottom:1.35rem;
  animation:fadeUp .7s .28s var(--ease-out) both;
}
.handle-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--p3);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%    {opacity:.5;transform:scale(.7)}
}

/* ─── thin rule ──────────────────────────────────── */
.rule{
  width:52px;height:1px;margin:0 auto 1.4rem;
  background:linear-gradient(90deg,transparent,var(--p2),transparent);
  animation:fadeUp .7s .38s both;
}

/* ─── bio ────────────────────────────────────────── */
.bio{
  font-size:.875rem;line-height:1.82;
  color:var(--dust);font-weight:300;
  max-width:300px;margin:0 auto 2rem;
  animation:fadeUp .7s .5s var(--ease-out) both;
}
.bio em{color:var(--ink);font-style:normal;font-weight:400;}

/* ─── buttons ────────────────────────────────────── */
.btns{
  display:flex;flex-direction:column;gap:.9rem;
  animation:fadeUp .7s .65s var(--ease-out) both;
}

.btn{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:.65rem;
  width:100%;padding:.95rem 1.6rem;
  border-radius:1.5rem;
  border:1.5px solid transparent;
  font-family:'Jost',sans-serif;
  font-size:.85rem;font-weight:400;
  letter-spacing:.07em;
  cursor:pointer;text-decoration:none;
  transition:transform .25s var(--ease-spring),
             box-shadow .25s ease,
             filter .2s ease;
  will-change:transform;
  -webkit-tap-highlight-color:transparent;
}
/* ripple */
.btn::after{
  content:'';position:absolute;
  width:120%;height:120%;top:-10%;left:-10%;
  background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),
    rgba(255,255,255,.55) 0%,transparent 65%);
  opacity:0;transition:opacity .4s;
}
.btn:hover::after{opacity:1;}
.btn:hover{transform:translateY(-4px) scale(1.025);}
.btn:active{transform:translateY(0) scale(.975);}

.btn-icon{font-size:1.1rem;line-height:1;flex-shrink:0;}

/* snap — warm golden champagne */
.btn-snap{
  background:linear-gradient(135deg,#fff8e1 0%,#ffe082 55%,#ffd54f 100%);
  color:#6b5000;
  border-color:rgba(255,213,79,.55);
  box-shadow:0 4px 22px rgba(255,213,79,.35),
             0 1px  0  rgba(255,255,255,.7) inset;
  text-shadow:0 1px 0 rgba(255,255,255,.4);
}
.btn-snap:hover{
  box-shadow:0 8px 36px rgba(255,213,79,.55),
             0 1px  0  rgba(255,255,255,.7) inset;
}

/* telegram — icy mist */
.btn-tg{
  background:linear-gradient(135deg,#e8f4fc 0%,#b3d8f0 55%,#90caf9 100%);
  color:#1a4f72;
  border-color:rgba(144,202,249,.5);
  box-shadow:0 4px 22px rgba(144,202,249,.35),
             0 1px  0  rgba(255,255,255,.75) inset;
  text-shadow:0 1px 0 rgba(255,255,255,.45);
}
.btn-tg:hover{
  box-shadow:0 8px 36px rgba(144,202,249,.55),
             0 1px  0  rgba(255,255,255,.75) inset;
}

/* ─── footer ──────────────────────────────────────── */
.foot{
  margin-top:1.8rem;
  font-size:.65rem;letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(180,120,140,.45);
  animation:fadeUp .7s .82s both;
}

/* ─── stagger helper ─────────────────────────────── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to  {opacity:1;transform:translateY(0)}
}

/* ─── floating ad bar ────────────────────────────── */
#ad-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  min-height:50px;
  background:rgba(255,244,247,.75);
  backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-top:1px solid rgba(255,195,215,.35);
  display:flex;align-items:center;justify-content:center;
}

/* ─── responsive ─────────────────────────────────── */
@media(max-width:380px){
  .card{padding:2.6rem 1.7rem 2.2rem}
  .name{font-size:2.5rem}
}
</style>
</head>
<body>

<!-- custom cursor -->
<div id="cur"></div>
<div id="cur-ring"></div>

<!-- main card -->
<div class="wrap">
  <div class="card">
    <div class="blob blob-tl"></div>
    <div class="blob blob-br"></div>

    <!-- avatar -->
    <div class="av-shell">
      <div class="av-ring">
        <div class="av-face">🌸</div>
      </div>
      <div class="av-badge">✨</div>
    </div>

    <!-- name -->
    <h1 class="name">sara</h1>

    <!-- handle pill -->
    <div class="handle">
      <span class="handle-dot"></span>
      she's online 🎀
    </div>

    <!-- divider -->
    <div class="rule"></div>

    <!-- bio -->
    <p class="bio">
      soft vibes, <em>big heart</em>, and a camera roll full of sunsets 🌅<br>
      i live for late-night laughs, iced lattes, and the people who <em>get it</em> —<br>
      come find me, i promise i'm the fun kind of trouble 🍓
    </p>

    <!-- buttons -->
    <div class="btns">
      <a href="https://www.snapchat.com/add/sc.sara04?share_id=ZucijvYDXgg&locale=en-US"
         target="_blank" rel="noopener" class="btn btn-snap"
         aria-label="Add Sara on Snapchat">
        <span class="btn-icon">👻</span>
        catch me on snap ✦
      </a>
      <a href="https://t.me/+H-pJB7BJtBEzY2Jl"
         target="_blank" rel="noopener" class="btn btn-tg"
         aria-label="Join Sara's Telegram">
        <span class="btn-icon">💌</span>
        join my little world
      </a>
    </div>

    <p class="foot">made with ♡ for sara</p>
  </div>
</div>

<!-- ── floating ad bar ── -->
<div id="ad-bar">
  <!-- FLOATING-SOCIAL-BAR-AD -->
</div>

<script>
/* ── custom cursor ───────────────────────────── */
const cur=document.getElementById('cur');
const ring=document.getElementById('cur-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  cur.style.left=mx+'px';cur.style.top=my+'px';
});
(function animRing(){
  rx+=(mx-rx)*.12; ry+=(my-ry)*.12;
  ring.style.left=rx+'px';ring.style.top=ry+'px';
  requestAnimationFrame(animRing);
})();
document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('mouseenter',()=>{
    cur.style.width='22px';cur.style.height='22px';
    cur.style.background='var(--p3)';
  });
  b.addEventListener('mouseleave',()=>{
    cur.style.width='14px';cur.style.height='14px';
    cur.style.background='var(--p2)';
  });
  /* ripple origin */
  b.addEventListener('mousemove',e=>{
    const r=b.getBoundingClientRect();
    b.style.setProperty('--rx',((e.clientX-r.left)/r.width*100)+'%');
    b.style.setProperty('--ry',((e.clientY-r.top)/r.height*100)+'%');
  });
});

/* ── floating sparkle particles ─────────────── */
const CHARS=['✦','✿','✩','⋆','🌸','❀','·'];
function mkSpark(){
  const s=document.createElement('span');
  s.className='spark';
  s.textContent=CHARS[Math.floor(Math.random()*CHARS.length)];
  s.style.left=Math.random()*100+'vw';
  const dur=10+Math.random()*14;
  s.style.animationDuration=dur+'s';
  s.style.animationDelay=(Math.random()*dur)+'s';
  s.style.fontSize=(.55+Math.random()*.55)+'rem';
  s.style.color=`hsl(${340+Math.random()*30},${70+Math.random()*20}%,${75+Math.random()*10}%)`;
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),(dur+5)*1000);
}
for(let i=0;i<18;i++) setTimeout(mkSpark,i*600);
setInterval(mkSpark,2200);
</script>
