<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Confessions 🎀</title>
<script src="https://pl29327852.profitablecpmratenetwork.com/e9/a6/2f/e9a62f0236d4cba7b9945285a51a12fd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #FFF9FA; font-family: 'Outfit', sans-serif; color: #444; display: flex; justify-content: center; }
.wrapper { width: 100%; max-width: 420px; padding: 130px 20px 40px; text-align: center; }
h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin: 0 0 10px 0; color: #222; white-space: nowrap; letter-spacing: -0.5px; }
.triggered-msg { display: block; font-size: 14px; font-weight: 600; color: #FF5C8A; margin-bottom: 30px; }
.privacy-disclaimer { font-size: 13px; color: #999; line-height: 1.7; margin-bottom: 35px; }
textarea { width: 100%; height: 190px; background: #ffffff; border: 1.5px solid #F8DFE3; border-radius: 25px; padding: 20px; font-family: inherit; font-size: 16px; color: #555; outline: none; resize: none; box-shadow: 0 10px 20px rgba(255, 133, 161, 0.03); }
.send-btn { width: 100%; padding: 20px; margin-top: 25px; border: none; border-radius: 50px; background: #FF5C8A; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 92, 138, 0.3); }
.bottom-badges { margin-top: 50px; display: flex; justify-content: center; gap: 15px; font-size: 10px; font-weight: 700; color: #ccc; text-transform: uppercase; letter-spacing: 1.5px; }
</style>
</head>
<body>

<script src="https://pl29327853.profitablecpmratenetwork.com/ae/2f/ad/ae2fad514d7c4219ef12f6032d341e55.js"></script>

<div class="wrapper">
  <h1>Private Confessions</h1>
  <span class="triggered-msg">Write your darkest secret... 🤫</span>
  <p class="privacy-disclaimer">Identity hidden. Fully secured.</p>
  <textarea id="msg" placeholder="Type it here, it stays between us..."></textarea>
  <button class="send-btn" onclick="startAd()">Share Privately ✨</button>
  <div class="bottom-badges"><span>🔒 ENCRYPTED</span><span>👻 ANONYMOUS</span></div>
</div>

<script>
function startAd() {
  const message = document.getElementById("msg").value;
  if(message.trim().length > 3) {
      // Refreshing helps trigger the popunder and clear the text
      alert("Secret Sent Anonymously! 🤫");
      location.reload();
  } else {
      alert("Please write something first!");
  }
}
</script>

</body>
</html>
